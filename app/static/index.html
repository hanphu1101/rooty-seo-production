<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooty SEO Production</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#fff; --surface-2:#faf9f6; --ink:#1c2628; --muted:#667174; --line:#e4e0d8;
  --brand:#0f7a6c; --brand-ink:#fff; --brand-soft:#e3f2ef;
  --ok:#1f8a4c; --ok-soft:#e5f5eb; --bad:#c2410c; --bad-soft:#fdeee5; --warn:#a16207; --warn-soft:#fdf5df;
  --info:#5b4bd6; --info-soft:#eeebff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101415; --surface:#181e20; --surface-2:#1d2427; --ink:#e6eceb; --muted:#97a3a5; --line:#2a3336;
    --brand:#3cc3ae; --brand-ink:#08201c; --brand-soft:#173430;
    --ok:#4ccf86; --ok-soft:#163023; --bad:#f08a5d; --bad-soft:#35201a; --warn:#e5b54a; --warn-soft:#30280f;
    --info:#a497ff; --info-soft:#24204a; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#101415; --surface:#181e20; --surface-2:#1d2427; --ink:#e6eceb; --muted:#97a3a5; --line:#2a3336;
  --brand:#3cc3ae; --brand-ink:#08201c; --brand-soft:#173430;
  --ok:#4ccf86; --ok-soft:#163023; --bad:#f08a5d; --bad-soft:#35201a; --warn:#e5b54a; --warn-soft:#30280f;
  --info:#a497ff; --info-soft:#24204a; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
code{font:12.5px ui-monospace,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hin{padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:inline-grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:14px}
.mode{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px}
.mode.demo{background:var(--warn-soft);color:var(--warn)}
.mode.lark{background:var(--ok-soft);color:var(--ok)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 53px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
nav.side .grp{font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}
nav.side button{display:flex;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:14px;gap:8px;align-items:center}
nav.side button:hover{background:var(--surface-2)}
nav.side button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side button em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .grp{display:none}
  nav.side button{width:auto;white-space:nowrap;flex:0 0 auto}
  nav.side button em{display:none}
}
main{padding:16px;min-width:0;max-width:1500px}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner b{color:var(--warn)}
/* guide */
details.guide{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
details.guide summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.guide summary::-webkit-details-marker{display:none}
details.guide .stp{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.4px}
details.guide h1{font-size:19px;margin:0;line-height:1.3}
details.guide .tg{margin-left:auto;font-size:12.5px;color:var(--muted)}
details.guide[open] .tg::after{content:"Thu gọn hướng dẫn ▲"}
details.guide:not([open]) .tg::after{content:"Xem hướng dẫn ▼"}
.gbody{padding:0 16px 14px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.gbody{grid-template-columns:1fr}}
.gbody p.goal{margin:0 0 8px;color:var(--ink)}
.gbody ol{margin:0;padding-left:20px}
.gbody ol li{margin:5px 0;font-size:14px}
.gbody h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.gbody ul.done{margin:0 0 12px;padding:0;list-style:none}
.gbody ul.done li{font-size:14px;padding:3px 0 3px 22px;position:relative}
.gbody ul.done li::before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:800}
.cmd{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font:13px ui-monospace,Consolas,monospace;word-break:break-all}
.cmd span{flex:1}
/* cards / stats */
.cards4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--brand)}
.kcard .stp{font-size:11.5px;font-weight:800;color:var(--brand);text-transform:uppercase}
.kcard b.big{font-size:24px;line-height:1.1}
.kcard .meta{font-size:13px}
.ph{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.meta{font-size:12.5px;color:var(--muted)}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.pill b{font-size:18px;display:block;line-height:1.2}
/* grid */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.gtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.gtool h3{margin:0;font-size:15px;margin-right:4px}
.gtool .cnt{font-size:12.5px;color:var(--muted);margin-right:auto}
.gtool input[type=search],.gtool select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13.5px;max-width:200px}
.gtool input[type=search]{width:190px}
.chipf{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600}
.chipf.on{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.tscroll{overflow-x:auto}
table.g{width:100%;border-collapse:collapse;font-size:13.5px}
table.g th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
table.g td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:340px}
table.g tr{cursor:pointer}
table.g tbody tr:hover td{background:var(--surface-2)}
table.g td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.g td:first-child{min-width:110px}
table.g td:first-child .trunc{white-space:normal}
.trunc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u{color:var(--brand);word-break:break-all}
#fxG .u,#gG .u{word-break:normal;white-space:nowrap}
.empty{font-size:13.5px;color:var(--muted);padding:18px;text-align:center}
.more{padding:10px;text-align:center;border-top:1px solid var(--line)}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);font-weight:600;white-space:nowrap;display:inline-block}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-brand{background:var(--brand-soft);color:var(--brand)}
/* kanban (B6) */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.stat.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1 1 240px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:160px;display:flex;flex-direction:column}
.col h3{margin:0;font-size:13.5px;padding:10px 12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--muted)}
.col h3 em{font-style:normal;background:var(--line);color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px}
.col .gate-tag{font-size:11px;color:var(--info);font-weight:600}
.cardsk{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--brand)}
.card .kw{font-weight:650;line-height:1.35}
.card .slug{font-size:12px;color:var(--muted);word-break:break-all;margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.st-Đang-làm{background:var(--brand-soft);color:var(--brand)}
.st-Bị-trả-về{background:var(--bad-soft);color:var(--bad)}
.st-Cần-người{background:var(--warn-soft);color:var(--warn)}
.st-Chờ-duyệt{background:var(--info-soft);color:var(--info)}
.st-Đã-đăng{background:var(--ok-soft);color:var(--ok)}
.gp{font-size:11px;width:24px;text-align:center;padding:1px 0;border-radius:5px;background:var(--line);color:var(--muted);font-weight:700;display:inline-block}
.gp.PASS{background:var(--ok-soft);color:var(--ok)}
.gp.FAIL{background:var(--bad-soft);color:var(--bad)}
.late{color:var(--bad);font-weight:600}
section.logs{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
section.logs h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.loglist{max-height:260px;overflow:auto;font-size:13.5px}
.loglist div{padding:7px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.loglist time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.loglist div>span{min-width:0;overflow-wrap:anywhere}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{margin:0;font-size:18px;line-height:1.3;flex:1;word-break:break-word}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.db{padding:16px;overflow:auto;flex:1}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.df .sp{flex:1}
.stepper{display:flex;gap:4px;margin:4px 0 14px;flex-wrap:wrap}
.stepper span{flex:1 1 60px;font-size:11px;text-align:center;padding:5px 2px;border-radius:6px;background:var(--line);color:var(--muted)}
.stepper span.done{background:var(--brand-soft);color:var(--brand)}
.stepper span.cur{background:var(--brand);color:var(--brand-ink);font-weight:700}
.move{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.move .btn{flex:1 1 180px}
.hint{font-size:12.5px;color:var(--muted);margin:-8px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label.full{grid-column:1/-1}
.field{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;width:100%}
textarea.field{min-height:80px;resize:vertical}
.db h4{margin:20px 0 8px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.tab.on{border-color:var(--info);background:var(--info-soft);color:var(--info)}
.crit{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;flex-direction:row;color:var(--ink)}
.crit input{margin-top:3px;accent-color:var(--brand)}
.crit .b{font-size:10.5px;font-weight:800;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:0 4px;margin-right:4px}
.verdict{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:10px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;gap:10px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form>div{padding:16px}
dialog h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}
dialog .df{border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:calc(100% - 32px);display:none}
.toast.err{background:var(--bad);color:#fff}
/* việc SEO */
.vhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.vhead .big{font-size:20px;font-weight:800}
.vhead .bar{flex:1 1 200px;min-width:160px;height:8px}
.vtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.vtools select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px}
.vtools label{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.phase>h3{margin:0;padding:10px 14px;font-size:14.5px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.phase>h3 .bar{width:200px}
.vrow{border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vmain{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 70px 132px;gap:10px;align-items:center;padding:9px 14px;cursor:pointer}
@media (max-width:760px){.vmain{grid-template-columns:40px minmax(0,1fr) 118px}.vmain .c-mang,.vmain .c-thang{display:none}}
.vmain:hover{background:var(--surface-2)}
.vrow.now .vmain{box-shadow:inset 3px 0 0 var(--brand)}
.vrow.late .vmain{box-shadow:inset 3px 0 0 var(--bad)}
.code{font:600 12.5px ui-monospace,Consolas,monospace;color:var(--muted)}
.vname{font-size:14px;line-height:1.4}
.vname .who{font-size:12px;color:var(--muted)}
.gate{font-size:10.5px;font-weight:800;color:var(--info);border:1px solid var(--info);border-radius:4px;padding:0 4px;margin-right:4px}
.latetag{font-size:10.5px;font-weight:800;color:var(--bad);margin-left:6px}
.c-mang .chip{white-space:normal;text-align:center}
.c-thang{font-size:13px;color:var(--muted)}
.vs{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:13px;width:100%}
.vs.s-Xong{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.vs.s-Đang-làm{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.vs.s-Bị-chặn{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.vdetail{display:none;padding:4px 14px 16px 68px}
@media (max-width:760px){.vdetail{padding-left:14px}}
.vrow.open .vdetail{display:block}
.vdetail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.vdetail a.btn{text-decoration:none;color:var(--ink)}
/* cụm */
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.cl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cl h4{margin:0 0 4px;font-size:15px}
.cl .pillar{font-size:12.5px;word-break:break-all}
.cl .nums{display:flex;gap:14px;margin-top:8px;font-size:13px}
.cl .nums b{font-size:16px}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media (max-width:760px){.journey{grid-template-columns:1fr 1fr}}
.jst{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.jst b{display:block;font-size:13.5px}
.jst span{font-size:12.5px;color:var(--muted)}
svg.chart text{fill:var(--muted);font-size:11px}
/* B5 · 5 hạng mục */
.areas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1100px){.areas{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.acard:hover{border-color:var(--brand)}
.acard.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.acard .ai{font-size:18px}
.acard .ascore{font-size:26px;font-weight:800;line-height:1.1}
/* B1 */
.sec{margin:20px 0 10px}
.sec:first-child{margin-top:0}
.sec h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sec h2 span{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:inline-grid;place-items:center;font-size:13px}
.sec p{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px}

<script>
/* ================= tiện ích ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('vi-VN') : '';
const fmtTime = ms => ms ? new Date(ms).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const toDateInput = ms => ms ? new Date(ms - new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,10) : '';
const fromDateInput = v => v ? new Date(v+'T00:00:00').getTime() : null;
const num = v => (v===null||v===undefined||v==='') ? null : Number(v);
const pathOf = u => String(u||'').replace(/^https?:\/\/[^/]+/,'') || '/';
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', err?6000:2600); }
/* Trong Marketing Hub trang nằm ở /m/seo/ và xin Hub không chèn CSS/JS (giữ giao diện riêng),
   nên tự thêm tiền tố cho đường /api/...; chạy riêng ở / thì BASE rỗng. */
const BASE = location.pathname.replace(/\/[^\/]*$/, '');
async function api(method, url, body){
  const r = await fetch(url.startsWith('/') ? BASE + url : url, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  const d = await r.json().catch(()=>({error:'Phản hồi không hợp lệ'}));
  if(!r.ok || (d && d.error)) throw new Error((d&&d.error) || ('HTTP '+r.status));
  return d;
}
function copy(text){ navigator.clipboard?.writeText(text).then(()=>toast('Đã copy: '+text.slice(0,60))).catch(()=>toast('Không copy được, hãy chọn và copy tay', true)); }

let CFG = null, VIEW = 'tongquan';
const DATA = {};      // cache bảng chung: key → rows
async function load(key, force){
  if(DATA[key] && !force) return DATA[key];
  DATA[key] = await api('GET', '/api/t/'+key);
  if(key==='trang') fillDatalists();
  return DATA[key];
}
function fillDatalists(){
  const urls = (DATA.trang||[]).map(r=>r.fields['URL']).filter(Boolean);
  $('#dlUrl').innerHTML = urls.slice(0,2000).map(u=>`<option value="${esc(u)}">`).join('');
  const cums = new Set([...(DATA.trang||[]), ...(DATA.tukhoa||[])].map(r=>r.fields['Cụm chủ đề']).filter(Boolean));
  $('#dlCum').innerHTML = [...cums].map(c=>`<option value="${esc(c)}">`).join('');
}

/* ================= điều hướng ================= */
const NAV = [
  {id:'tongquan', label:'Tổng quan'},
  {id:'chandoan', label:'🩺 Chẩn đoán rớt top'},
  {grp:'1 · Discovery'},
  {id:'khach', label:'B1 · Khách hàng & hành trình', key:'khach'},
  {id:'tukhoa', label:'B2 · Từ khoá', key:'tukhoa'},
  {id:'cum', label:'B3 · Cụm chủ đề & silo', key:'trang'},
  {id:'doithu', label:'B4 · Đối thủ', key:'doithu'},
  {grp:'2 · Improving'},
  {id:'kythuat', label:'B5 · Audit 5 hạng mục', key:'kythuat'},
  {id:'audit', label:'B5 · Danh sách lỗi & sửa', key:'sualoi'},
  {id:'kiemweb', label:'B5 · Kiểm nhiều website', key:'kiemweb'},
  {grp:'3 · Create & Optimize'},
  {id:'content', label:'B6 · Content'},
  {id:'gia', label:'B6 · Giá & dữ kiện', key:'giadukien'},
  {id:'onpage', label:'B7 · Onpage'},
  {id:'entity', label:'B8 · Entity', key:'hoso'},
  {id:'gmaps', label:'B8 · Google Maps', key:'gbp'},
  {id:'geo', label:'GEO · AI Search', key:'geo'},
  {grp:'4 · Promotion'},
  {id:'link', label:'B9 · Link building', key:'lienket'},
  {id:'hesinhthai', label:'B9 · Hệ sinh thái Google', key:'hesinhthai'},
  {grp:'5 · Evaluate'},
  {id:'danhgia', label:'B10 · Đánh giá', key:'danhgia'},
  {id:'algo', label:'B10 · Thuật toán Google', key:'thuattoan'},
  {grp:'Quản lý'},
  {id:'kehoach', label:'Kế hoạch 10 tháng'},
];
function renderNav(){
  $('#nav').innerHTML = NAV.map(n => n.grp ? `<div class="grp">${esc(n.grp)}</div>`
    : `<button data-v="${n.id}" class="${VIEW===n.id?'on':''}">${esc(n.label)}${n.key && DATA[n.key] ? `<em>${DATA[n.key].length}</em>`:''}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v){ VIEW=v; store.set('rooty-view2', v); renderNav(); render(); window.scrollTo(0,0); }

function guide(id){
  const g = GUIDES[id]; if(!g) return '';
  const open = store.get('guide-open-'+id, true);
  return `<details class="guide" ${open?'open':''} data-g="${id}">

      <div><h4>Đạt khi</h4><ul class="done">${g.done.map(s=>`<li>${s}</li>`).join('')}</ul>

function wireCommon(root){

/* ================= bảng dữ liệu chung ================= */
const GRID_STATE = {};
function chipClass(field, v){
  if(!v) return '';
  if(/^(Đạt|Khớp|Có|Đã có|Đã sửa|Xong|Đang live|Đã xác nhận|Tốt|Cao|Mua|Đã gán trang|Đã đăng)$/.test(v)) return 'c-ok';
  if(/^(Chưa đạt|Lệch|Mất link|🔴 Cao|Cần viết|Xoá|Chưa có|CHƯA – thêm link)$/.test(v)) return 'c-bad';
  if(/^(🟡 Vừa|Cần sửa|Đang sửa|Đang làm|Đang viết|Vừa|Cân nhắc|Gộp|Cần sửa|Giả định|Kế hoạch)$/.test(v)) return 'c-warn';
  if(/^(Pillar \(trụ cột\)|Nội bộ|Trang tour\/sản phẩm|Trang sản phẩm)$/.test(v)) return 'c-info';
  return '';
}
function cell(f, v){
  if(v===null || v===undefined || v==='') return '<span class="meta">—</span>';
  switch(f.k){
    case 'select': return `<span class="chip ${chipClass(f.n, v)}">${esc(v)}</span>`;
    case 'url': return `<span class="u" title="${esc(v)}">${esc(pathOf(v))}</span>`;
    case 'date': return esc(fmtDate(v));
    case 'num': case 'dec': return esc(Number(v).toLocaleString('vi-VN'));
    case 'long': return `<span class="trunc" title="${esc(v)}">${esc(v)}</span>`;
    default: return `<span class="trunc">${esc(v)}</span>`;
  }
}
/* opts: {title, cols, filters, chips:[{id,label,fn}], actions:[{label,cls,fn}], defaults, sort, limit} */
async function grid(el, key, opts){
  const meta = CFG.tables[key], fields = meta.fields, F = Object.fromEntries(fields.map(f=>[f.n,f]));
  const st = GRID_STATE[key+(opts.sid||'')] ||= {q:'', f:{}, chip:null, limit: opts.limit||100};
  const rows = await load(key);
  const cols = (opts.cols||fields.slice(0,6).map(f=>f.n)).map(n=>F[n]).filter(Boolean);
  const draw = () => {
    const base = opts.where ? rows.filter(r=>opts.where(r.fields)) : rows;
    let list = base.filter(r=>{
      const f = r.fields;
      if(st.q &&!Object.values(f).join(' ').toLowerCase().includes(st.q.toLowerCase())) return false;
      for(const [k,v] of Object.entries(st.f)) if(v && (f[k]||'') !== v) return false;
      if(st.chip){ const c=(opts.chips||[]).find(c=>c.id===st.chip); if(c && !c.fn(f)) return false; }
      return true;
    });
    if(opts.sort) list = list.slice().sort((a,b)=>opts.sort(a.fields,b.fields));
    const filterSel = (opts.filters||[]).map(n=>{
      const fd = F[n]; let vals = fd.k==='select' ? fd.o : [...new Set(rows.map(r=>r.fields[n]).filter(Boolean))].sort();
      return `<select data-f="${esc(n)}" aria-label="${esc(n)}"><option value="">${esc(n)}: tất cả</option>${vals.map(v=>`<option ${st.f[n]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
    }).join('');
    const chips = (opts.chips||[]).map(c=>`<button class="chipf ${st.chip===c.id?'on':''}" data-chip="${c.id}">${esc(c.label)}</button>`).join('');
    const acts = (opts.actions||[]).map((a,i)=>`<button class="btn sm ${a.cls||''}" data-act="${i}">${esc(a.label)}</button>`).join('');
    const seed = (!rows.length && meta.seed) ? `<button class="btn sm" data-seed>Nạp dữ liệu mẫu</button>` : '';
    el.innerHTML = `<div class="gwrap">
      <div class="gtool"><h3>${esc(opts.title||meta.name)}</h3><span class="cnt">${list.length}/${base.length} dòng</span>
        <input type="search" placeholder="Tìm…" value="${esc(st.q)}" aria-label="Tìm trong ${esc(meta.name)}">${filterSel}${chips}${seed}${acts}
        <button class="btn sm primary" data-add>+ Thêm</button></div>
      <div class="tscroll">${list.length ? `<table class="g"><thead><tr>${cols.map(c=>`<th>${esc(c.n)}</th>`).join('')}</tr></thead>
        <tbody>${list.slice(0,st.limit).map(r=>`<tr data-id="${r.record_id}">${cols.map(c=>`<td class="${['num','dec'].includes(c.k)?'num':''}">${cell(c, r.fields[c.n])}</td>`).join('')}</tr>`).join('')}</tbody></table>`
        : `<div class="empty">${rows.length?'Không có dòng nào khớp bộ lọc.':'Chưa có dữ liệu. Bấm “+ Thêm”'+(meta.seed?' hoặc “Nạp dữ liệu mẫu”':'')+(opts.emptyHint?' · '+opts.emptyHint:'')+'.'}</div>`}</div>
      ${list.length>st.limit?`<div class="more"><button class="btn sm" data-more>Hiện thêm (${list.length-st.limit} dòng nữa)</button></div>`:''}
    </div>`;
    const s = el.querySelector('input[type=search]');
    s.oninput = ()=>{ st.q=s.value; const pos=s.selectionStart; draw(); const n=el.querySelector('input[type=search]'); n.focus(); n.setSelectionRange(pos,pos); };
    el.querySelectorAll('select[data-f]').forEach(x=>x.onchange=()=>{ st.f[x.dataset.f]=x.value; draw(); });
    el.querySelectorAll('[data-chip]').forEach(x=>x.onclick=()=>{ st.chip = st.chip===x.dataset.chip?null:x.dataset.chip; draw(); });
    el.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>opts.actions[+x.dataset.act].fn());
    el.querySelector('[data-add]').onclick = ()=>openForm(key, null, opts.defaults||{}, opts.onSave, opts.formActions);
    el.querySelector('[data-seed]')?.addEventListener('click', async()=>{ try{ const r=await api('POST',`/api/t/${key}/seed`); toast(r.message); await load(key,true); render(); }catch(e){ toast(e.message,true); } });
    el.querySelector('[data-more]')?.addEventListener('click', ()=>{ st.limit+=200; draw(); });
    el.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>openForm(key, rows.find(r=>r.record_id===tr.dataset.id), {}, opts.onSave, opts.formActions));
  };
  draw();
}

/* ================= form chung trong drawer ================= */
function openDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); CUR=null; }
$('#dClose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#drawer').classList.contains('on')) closeDrawer(); });

function openForm(key, rec, defaults, onSave, extra){
  const meta = CFG.tables[key], f = rec ? rec.fields : defaults;
  $('#dTitle').textContent = rec ? (f[meta.fields[0].n] || meta.name) : `Thêm vào «${meta.name}»`;
  $('#dBody').innerHTML = `<div class="grid2">${meta.fields.map((fd,i)=>{
    const v = f[fd.n]; const id = 'ff'+i; const full = ['long','url'].includes(fd.k) || i===0 ? 'full' : '';
    let input;
    if(fd.k==='select') input = `<select class="field" id="${id}"><option value="">—</option>${fd.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(fd.k==='long') input = `<textarea class="field" id="${id}">${esc(v)}</textarea>`;
    else if(fd.k==='date') input = `<input class="field" type="date" id="${id}" value="${toDateInput(v)}">`;
    else if(fd.k==='num'||fd.k==='dec') input = `<input class="field" type="number" step="${fd.k==='dec'?'0.1':'1'}" id="${id}" value="${v??''}">`;
    else { const dl = fd.k==='url' ? 'list="dlUrl"' : fd.n==='Cụm chủ đề' ? 'list="dlCum"' : '';
      input = `<input class="field" id="${id}" ${dl} value="${esc(v)}">${fd.k==='url'&&v?`<a href="${esc(v)}" target="_blank" rel="noopener" style="font-size:12px">Mở link ↗</a>`:''}`; }
    return `<label class="${full}">${esc(fd.n)}${i===0?' *':''}${input}</label>`;
  }).join('')}</div>`;
  $('#dFoot').innerHTML = `${rec?'<button class="btn danger" id="fDel">Xoá</button>':''}${rec&&extra?extra.map((a,i)=>`<button class="btn" data-x="${i}">${esc(a.label)}</button>`).join(''):''}<span class="sp"></span><button class="btn" id="fCancel">Huỷ</button><button class="btn primary" id="fSave">${rec?'Lưu':'Thêm'}</button>`;
  if(rec && extra) $('#dFoot').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{ const t=b.textContent; b.disabled=true; b.textContent='Đang xử lý…';
    try{ await extra[+b.dataset.x].fn(rec); const fresh=(DATA[key]||[]).find(r=>r.record_id===rec.record_id); if(fresh) openForm(key, fresh, {}, onSave, extra); }
    catch(e){ toast(e.message,true); b.disabled=false; b.textContent=t; } });
  $('#fCancel').onclick = closeDrawer;
  $('#fSave').onclick = async ()=>{
    const body = {};
    meta.fields.forEach((fd,i)=>{ const el=$('#ff'+i); let v = el.value;
      if(fd.k==='date') v = fromDateInput(v); else if(fd.k==='num'||fd.k==='dec') v = v===''?null:Number(v);
      body[fd.n] = v; });
    if(onSave) onSave(body);
    try{
      if(rec) await api('PATCH', `/api/t/${key}/${rec.record_id}`, body); else await api('POST', `/api/t/${key}`, body);
      toast(rec?'Đã lưu':'Đã thêm'); closeDrawer(); await load(key, true); renderNav(); render();
    }catch(e){ toast(e.message, true); }
  };
  if(rec) $('#fDel').onclick = async ()=>{
    if(!confirm('Xoá dòng này? Không hoàn tác được.')) return;
    try{ await api('DELETE', `/api/t/${key}/${rec.record_id}`); toast('Đã xoá'); closeDrawer(); await load(key,true); renderNav(); render(); }
    catch(e){ toast(e.message, true); }
  };
  openDrawer();
}

/* ================= CSV ================= */
async function readFileText(file){
  // Keyword Planner xuất CSV dạng UTF-16 (BOM FF FE), có tab; các công cụ khác thường UTF-8
  const buf = new Uint8Array(await file.arrayBuffer());
  if(buf[0]===0xFF && buf[1]===0xFE) return new TextDecoder('utf-16le').decode(buf);
  if(buf[0]===0xFE && buf[1]===0xFF) return new TextDecoder('utf-16be').decode(buf);
  return new TextDecoder('utf-8').decode(buf);
}
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text = text.replace(/^﻿/,'');
  const first = text.split('\n').slice(0,5).join('\n');
  const cnt = ch => (first.split(ch).length-1);
  const sep = cnt('\t') > Math.max(cnt(','), cnt(';')) ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
/* tìm dòng tiêu đề (Keyword Planner có 2 dòng tiêu đề phụ ở trên) */
function headerRow(rows, re){ for(let i=0;i<Math.min(rows.length,8);i++){ if(rows[i].some(x=>re.test(x.toLowerCase()))) return i; } return -1; }
const toNum = (v, dec) => { if(v==null) return null; let s=String(v).trim().replace('%',''); if(!s || s==='-' ) return null;
  const m = s.match(/^(\d[\d.,]*)\s*[–-]\s*(\d[\d.,]*)/); if(m) s = m[1];   // "1K – 10K" hoặc "100 - 1000" → cận dưới
  s = s.replace(/k$/i,'000');
  if(dec){ if(s.includes(',') && !s.includes('.')) s=s.replace(',','.'); } else s=s.replace(/[^\d.-]/g,'').replace(/\.(?=\d{3}\b)/g,'');
  const n=Number(s); return isNaN(n)?null:n; };
function guessIntent(k){
  k=k.toLowerCase();
  if(/rooty/.test(k)) return 'Điều hướng';
  if(/nên |hay |so sánh|review|đánh giá|uy tín|tốt nhất|top |kinh nghiệm|có nên/.test(k)) return 'Cân nhắc';
  if(/giá|bao nhiêu tiền|đặt|book|mua|(^|\s)(tour|combo|vé|khách sạn|resort|cano|thuê xe)(\s|$)/.test(k)) return 'Mua';
  return 'Thông tin';
}
const INTENT_STAGE = {'Thông tin':'Nhận thức','Cân nhắc':'Cân nhắc','Mua':'Quyết định','Điều hướng':'Quyết định'};
function toolIntent(s){ s=(s||'').toLowerCase(); if(/transac/.test(s)) return 'Mua'; if(/commerc/.test(s)) return 'Cân nhắc'; if(/navig|brand/.test(s)) return 'Điều hướng'; if(/inform/.test(s)) return 'Thông tin'; return null; }
function pickFile(cb){ const inp=$('#csvFile'); inp.value=''; inp.onchange=async()=>{ const f=inp.files[0]; if(f) cb(parseCSV(await readFileText(f)), f.name); }; inp.click(); }
function importKeywordsCSV(){
  pickFile(async (rows, fname)=>{
    const hi = headerRow(rows, /quer|truy v|từ khoá|từ khóa|keyword/); if(hi<0){ toast('Không thấy cột từ khoá/truy vấn trong file', true); return; }
    const h = rows[hi].map(x=>x.toLowerCase().trim()), idx = re => h.findIndex(x=>re.test(x));
    const iq=idx(/^(top )?quer|truy v|từ khoá|từ khóa|^keyword$|keyword/), ic=idx(/click|nhấp/), ii=idx(/impr|hiển thị/), ip=idx(/posit|vị trí/),
      iv=idx(/avg\. monthly|monthly searches|lượt tìm kiếm trung bình|volume|lượng tìm|search vol/), id=idx(/difficult|độ khó|^kd/),
      icpc=idx(/cpc|top of page bid \(high|giá thầu đầu trang \(cao|giá thầu/), icomp=idx(/^competition$|^cạnh tranh$|competition|cạnh tranh/),
      ipar=idx(/parent/), iint=idx(/intent|ý định/);
    let src = 'Công cụ từ khoá';
    if(ic>=0||ii>=0) src='Search Console'; else if(h.some(x=>/avg\. monthly|lượt tìm kiếm trung bình|top of page bid|giá thầu/.test(x))) src='Keyword Planner';
    else if(id>=0||ipar>=0) src='Ahrefs/Semrush'; else if(/keywordtool/i.test(fname)) src='Keywordtool.io';
    const recs = rows.slice(hi+1).map(r=>{ const kw=(r[iq]||'').trim(); const it = (iint>=0 && toolIntent(r[iint])) || guessIntent(kw); return {
      'Từ khoá': kw, 'Ý định': it, 'Giai đoạn': INTENT_STAGE[it], 'Nguồn': src, 'Trạng thái': 'Mới',
      'Lượt nhấp': ic>=0?toNum(r[ic]):null, 'Hiển thị': ii>=0?toNum(r[ii]):null, 'Vị trí': ip>=0?toNum(r[ip],true):null,
      'Lượng tìm': iv>=0?toNum(r[iv]):null, 'Độ khó': id>=0?toNum(r[id]):null, 'CPC': icpc>=0?toNum(r[icpc]):null,
      'Cạnh tranh': icomp>=0?(r[icomp]||'').trim():'', 'Từ khoá cha': ipar>=0?(r[ipar]||'').trim():'' }; }).filter(r=>r['Từ khoá']);
    try{ const res = await api('POST','/api/t/tukhoa/bulk',{records:recs}); toast(`${src}: ${res.message}`); await load('tukhoa',true); renderNav(); render(); }
    catch(e){ toast(e.message, true); }
  });
}
function importCompetitorCSV(){

    const h = rows[hi].map(x=>x.toLowerCase().trim()), idx = re => h.findIndex(x=>re.test(x));
    const iq=idx(/keyword|từ khoá|từ khóa/), ip=idx(/^position$|^current position|vị trí|^pos/), iv=idx(/volume|lượng tìm|search vol/),

function exportCSV(key, fname){
  const meta = CFG.tables[key], rows = DATA[key]||[];
  const q = v => { const s = v==null ? '' : String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [meta.fields.map(f=>q(f.n)).join(',')].concat(rows.map(r=>meta.fields.map(f=>q(f.k==='date'&&r.fields[f.n]?toDateInput(r.fields[f.n]):r.fields[f.n])).join(',')));
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname || (key+'.csv'); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

async function jobPanel(el, name, label, startUrl, body, refreshKeys){
  const draw = s => {
    el.innerHTML = `<div class="vhead" style="margin-bottom:10px"><div style="flex:1 1 300px">${s.running?`<b>Đang chạy…</b> <span class="meta">có thể chuyển tab khác</span>`:(s.result?`<span class="meta">Lần chạy gần nhất:</span> ${esc(s.result)}`:'<span class="meta">Chưa chạy lần nào.</span>')}
      ${s.running?`<div class="meta" style="font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap">${esc(s.lines.slice(-2).join('\n'))}</div>`:''}</div>
      <button class="btn primary" ${s.running?'disabled':''}>${s.running?'Đang chạy…':esc(label)}</button></div>`;
    el.querySelector('button').onclick = async ()=>{ try{ const r=await api('POST', startUrl, typeof body==='function'?body():body); toast(r.message); poll(); }catch(e){ toast(e.message,true); } };
  };
  const poll = async ()=>{
    clearTimeout(JOB_POLL[name]);

  };
  await poll();
}

let CRAWL_POLL = null;
async function crawlPanel(el){
  const draw = s => {
    const last = s.lastReport ? `Báo cáo crawl mới nhất: <b>${esc(s.lastReport)}</b> · ${fmtTime(s.lastReportAt)}` : 'Chưa có báo cáo crawl.';
    el.innerHTML = `<div class="vhead">
      <div style="flex:1 1 320px"><div class="meta">Website: ${esc(s.site)}</div><div>${s.running ? '<b>Đang crawl…</b> <span class="meta">mất vài phút — có thể chuyển tab khác</span>' : last}</div>
        ${s.running || s.result ? `<div class="meta" style="margin-top:4px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap">${esc(s.running ? s.lines.slice(-2).join('\n') : s.result)}</div>`:''}</div>
      <button class="btn" id="btnCheck">Kiểm tự động</button>
      <button class="btn primary" id="btnCrawl" ${s.running?'disabled':''}>${s.running?'Đang chạy…':'Chạy crawl'}</button></div>`;
    $('#btnCrawl').onclick = async ()=>{ try{ const r=await api('POST','/api/run/crawl',{maxPages:1500}); toast(r.message); poll(); }catch(e){ toast(e.message,true); } };
    $('#btnCheck').onclick = async ()=>{ const b=$('#btnCheck'); b.disabled=true; b.textContent='Đang kiểm… (~40 giây)';
      try{ const r=await api('POST','/api/tech/check'); toast(r.message); await load('kythuat',true); renderNav(); if(VIEW==='kythuat') render(); }
      catch(e){ toast(e.message,true); b.disabled=false; b.textContent='Kiểm tự động'; } };
  };
  const poll = async ()=>{
    clearTimeout(CRAWL_POLL);
    const s = await api('GET','/api/run/status');
    if(!el.isConnected) return;
    draw(s);
    if(s.running) CRAWL_POLL = setTimeout(poll, 3000);
    else if(s.finished && s.finished !== store.get('crawl-seen',0)){ store.set('crawl-seen', s.finished); toast('Crawl xong — '+s.result.slice(0,120));
      ['trang','audit','kythuat'].forEach(k=>delete DATA[k]); renderNav(); render(); }
  };
  await poll();
}

/* ---------- Sửa lỗi từng trang: lỗi × URL × trạng thái × thứ hạng trước/sau ---------- */
const FIX_OPEN = ['Mới','Đã xác nhận','Đang sửa','Sửa chưa đạt','Tái phát'], FIX_DONE = ['Đã sửa','Hết lỗi (quét lại)'];
async function fixSection(v){
  const box = document.createElement('div');
  box.innerHTML = `<div class="sec"><h2><span>✓</span> Sửa lỗi từng trang — lưu trạng thái đến khi sửa xong, đo thứ hạng trước/sau</h2>
    <p class="meta">Mỗi dòng = <b>1 lỗi trên 1 trang</b>. Nhập báo cáo lỗi (file Google Sheets: <i>Tệp → Tải xuống → Microsoft Excel (.xlsx)</i>; mỗi tab một loại lỗi, có cột <b>URL</b> hoặc <b>Các URL</b>). Đổi trạng thái khi làm: <b>Mới → Đã xác nhận → Đang sửa → Đã sửa</b>. Lúc chuyển sang “Đã sửa” trang tự ghi <b>ngày sửa</b> và chụp số liệu GSC lúc đó làm mốc <b>“trước”</b>. Sau ≥ 4 tuần, nhập GSC Trang mới ở B10 → bấm <b>“Đo hiệu quả”</b> để ghi “sau” và kết luận Tốt lên / Không đổi / Giảm. Trang chưa sửa cùng loại lỗi được đo làm <b>nhóm đối chứng</b>, để biết thay đổi là do sửa hay do cả site lên/xuống. Nhập báo cáo đợt quét mới → lỗi còn thấy ở trang đã sửa thành <b>“Tái phát”</b>, lỗi không còn thấy thành <b>“Hết lỗi (quét lại)”</b>.</p></div>
    <div class="vhead"><button class="btn primary" id="fxImp">Nhập báo cáo lỗi (.xlsx)</button><input type="file" id="fxFile" accept=".xlsx" hidden>
      <button class="btn" id="fxMeasure">Đo hiệu quả (sau khi nhập GSC mới)</button><span class="meta">Máy tự kiểm lại được: <b>Link tự thân</b>, <b>Đổi năm giả</b>; loại khác người kiểm.</span></div>
    <div id="fxJob"></div><div class="gwrap" style="padding:12px 14px" id="fxSum"></div><div id="fxG"></div>`;
  v.appendChild(box);
  $('#fxImp').onclick = ()=>$('#fxFile').click();
  $('#fxFile').onchange = async e=>{ const file=e.target.files[0]; if(!file) return;
    const b64 = await new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=no; r.readAsDataURL(file); });
    try{ toast('Đang nhập…'); const r=await api('POST','/api/loi/import',{name:file.name, b64}); toast(r.message); ['sualoi','audit'].forEach(k=>delete DATA[k]); renderNav(); render(); }catch(err){ toast(err.message,true); } };
  $('#fxMeasure').onclick = ()=>act('/api/loi/measure',['sualoi']);
  jobPanel($('#fxJob'), 'loicheck', 'Kiểm lại trang (mở từng trang còn lỗi / đã sửa, xem lỗi còn không)', '/api/loi/recheck', {}, ['sualoi']);
  await load('sualoi');
  let S = {kinds:{}}; try{ S = await api('GET','/api/loi/summary'); }catch(e){}
  const st = GRID_STATE['sualoi'] ||= {q:'', f:{}, chip:null, limit:100};
  const fmt = (x,unit,goodNeg)=> x==null||x.median==null ? '<span class="meta">—</span>' : `<b style="color:var(${(goodNeg? x.median<0 : x.median>0)?'--ok':x.median===0?'--muted':'--bad'})">${x.median>0?'+':''}${Number(x.median).toLocaleString('vi-VN')}${unit}</b> <span class="meta">(${x.n} trang)</span>`;
  const K = Object.entries(S.kinds).sort((a,b)=>b[1].open-a[1].open);
  $('#fxSum').innerHTML = K.length ? `<table class="g"><thead><tr><th>Loại lỗi</th><th>Tổng</th><th>Còn mở</th><th>Đã sửa</th><th>Bỏ qua / không phải lỗi</th><th style="min-width:140px">Tiến độ</th><th>Δ lượt nhấp — đã sửa</th><th>Δ lượt nhấp — chưa sửa (đối chứng)</th><th>Δ vị trí — đã sửa</th><th>Δ vị trí — đối chứng</th><th>Kết quả đo</th></tr></thead><tbody>${K.map(([k,d])=>{ const done=d.fixed+d.skip, p=d.total?Math.round(done/d.total*100):0;
      return `<tr data-k="${esc(k)}" style="cursor:pointer" class="${st.f['Loại lỗi']===k?'on':''}"><td><b>${esc(k)}</b></td><td class="num">${d.total}</td><td class="num">${d.open?`<b style="color:var(--bad)">${d.open}</b>`:0}</td><td class="num">${d.fixed}</td><td class="num">${d.skip}</td>
        <td><div class="bar" style="margin:0"><i style="width:${p}%"></i></div><span class="meta">${p}%</span></td>
        <td>${fmt(d.fixClicks,'')}</td><td>${fmt(d.ctlClicks,'')}</td><td>${fmt(d.fixPos,'',true)}</td><td>${fmt(d.ctlPos,'',true)}</td>
        <td><span class="meta">${Object.entries(d.effect).map(([e,n])=>`${esc(e)} ${n}`).join(' · ')||'chưa đo'}</span></td></tr>`; }).join('')}</tbody></table>
    <p class="meta" style="margin:8px 0 0">Δ = trung vị thay đổi “sau − trước” (vị trí: số âm là lên hạng). Sửa có tác dụng khi nhóm <b>đã sửa</b> tốt hơn rõ rệt so với nhóm <b>đối chứng</b> cùng kỳ. Bấm một dòng để lọc bảng dưới.</p>`
    : '<span class="meta">Chưa có lỗi nào — bấm “Nhập báo cáo lỗi (.xlsx)”.</span>';
  $('#fxSum').querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>{ st.f['Loại lỗi'] = st.f['Loại lỗi']===tr.dataset.k ? '' : tr.dataset.k; render(); });
  const lv = {'🔴 Cao':0,'🟡 Vừa':1,'🟢 Thấp':2}, so = s=>{ const i=['Tái phát','Sửa chưa đạt','Đang sửa','Đã xác nhận','Mới','Đã sửa','Hết lỗi (quét lại)','Không phải lỗi','Bỏ qua'].indexOf(s); return i<0?9:i; };
  await grid($('#fxG'),'sualoi',{title: st.f['Loại lỗi'] ? `Sửa lỗi · ${st.f['Loại lỗi']}` : 'Sửa lỗi từng trang',
    cols:['Loại lỗi','URL','Ngôn ngữ','Mức độ','Trạng thái','Cần sửa gì','Người sửa','Hạn','Ngày sửa','Kiểm lại','Nhấp trước','Vị trí trước','Nhấp sau','Vị trí sau','Hiệu quả'],
    filters:['Loại lỗi','Trạng thái','Mức độ','Ngôn ngữ','Hiệu quả','Đợt quét'], limit:100,
    chips:[{id:'open',label:'Còn mở',fn:f=>FIX_OPEN.includes(f['Trạng thái'])},{id:'again',label:'Tái phát / sửa chưa đạt',fn:f=>['Tái phát','Sửa chưa đạt'].includes(f['Trạng thái'])},
      {id:'wait',label:'Đã sửa, chờ đo',fn:f=>FIX_DONE.includes(f['Trạng thái'])&&(!f['Hiệu quả']||f['Hiệu quả']==='Chờ đo')},{id:'up',label:'Tốt lên',fn:f=>f['Hiệu quả']==='Tốt lên'},{id:'down',label:'Giảm',fn:f=>f['Hiệu quả']==='Giảm'}],
    sort:(a,b)=>so(a['Trạng thái'])-so(b['Trạng thái'])||(lv[a['Mức độ']]??3)-(lv[b['Mức độ']]??3)||String(a['Loại lỗi']).localeCompare(String(b['Loại lỗi'])),
    formActions:[{label:'Kiểm lại trang này', fn: async rec=>{ const r=await api('POST','/api/loi/recheck',{ids:[rec.record_id]}); toast(r.message+' — xem kết quả sau vài giây'); setTimeout(async()=>{ await load('sualoi',true); if(VIEW==='audit') render(); }, 6000); }}],
    actions:[{label:'Xuất CSV', fn:()=>exportCSV('sualoi','sua-loi-tung-trang.csv')}],
    defaults:{'Trạng thái':'Mới','Ngày phát hiện':Date.now()}, emptyHint:'nhập báo cáo lỗi .xlsx'});
}

function chart(rows){
  const W=900,H=220,P=36, n=rows.length;
  const s1 = rows.map(f=>Number(f['Lượt nhấp']||0)), s2 = rows.map(f=>Number(f['Chuyển đổi organic']||0));
  const rng = s => { const lo=Math.min(...s), hi=Math.max(...s,1), pad=(hi-lo)*0.15||hi*0.1||1; return [Math.max(0,lo-pad), hi+pad]; };
  const m1 = rng(s1), m2 = rng(s2);
  const x = i => P + i*(W-2*P)/Math.max(n-1,1), y = (v,[lo,hi]) => H-P - (v-lo)/(hi-lo)*(H-2*P);
  const line = (s,m) => s.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v,m).toFixed(1)}`).join('');
  return `<div class="meta" style="margin-bottom:6px"><span style="color:var(--brand);font-weight:700">━ Lượt nhấp</span> &nbsp; <span style="color:var(--info);font-weight:700">━ Chuyển đổi organic</span> (thang riêng)</div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ lượt nhấp và chuyển đổi theo tháng">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/>
    <path d="${line(s1,m1)}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
    <path d="${line(s2,m2)}" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="5 4"/>
    ${rows.map((f,i)=>`<circle cx="${x(i)}" cy="${y(s1[i],m1)}" r="3.5" fill="var(--brand)"><title>${f['Tháng']}: ${s1[i]} lượt nhấp · ${s2[i]} chuyển đổi</title></circle><text x="${x(i)}" y="${H-P+16}" text-anchor="middle">${esc(f['Tháng'])}</text>`).join('')}
    <text x="${P}" y="${P-10}">Lượt nhấp: ${Math.min(...s1).toLocaleString('vi-VN')} – ${Math.max(...s1).toLocaleString('vi-VN')}</text>
  </svg>`;
}

/* ---------- Chẩn đoán rớt top: 1 nút → 4 bước ---------- */
function mdHtml(md){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/_(.+?)_/g,'<i>$1</i>').replace(/\[(ĐÃ KIỂM)\]/g,'<span class="chip c-ok">$1</span>').replace(/\[(NGHI VẤN)\]/g,'<span class="chip c-warn">$1</span>');
  const out=[]; let tbl=null, list=null;
  const flush=()=>{ if(tbl){ out.push(`<div class="tscroll"><table class="g"><thead><tr>${tbl[0].map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); tbl=null; }
    if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join('')}</${list.t}>`); list=null; } };
  for(const line of md.split('\n')){
    if(/^\|/.test(line)){ if(/^\|[-| ]+\|$/.test(line)) continue; (tbl ||= []).push(line.replace(/^\||\|$/g,'').split('|').map(s=>s.trim())); continue; }
    let m;
    if((m=line.match(/^(\d+)\.\s+(.*)/))){ if(!list||list.t!=='ol'){ flush(); list={t:'ol',items:[]}; } list.items.push(m[2]); continue; }
    if((m=line.match(/^-\s+(.*)/))){ if(!list||list.t!=='ul'){ flush(); list={t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    flush();
    if((m=line.match(/^(#{1,3})\s+(.*)/))) out.push(`<h${m[1].length+1} style="margin:14px 0 6px">${inline(m[2])}</h${m[1].length+1}>`);
    else if(line.trim()) out.push(`<p style="margin:6px 0">${inline(line)}</p>`);
  }
  flush(); return out.join('');
}

let VIEC = [], OPEN = new Set();

function vState(f){ const cur=CFG.currentMonth, done=['Xong','Không áp dụng'].includes(f['Trạng thái']), den=Number(f['Đến tháng'])||0, tu=Number(f['Từ tháng'])||0;
  return { done, late: !done && den && den < cur, now: !done && tu<=cur && cur<=den }; }
function renderViec(){
  const [y,m] = CFG.projectStart.split('-'), total = VIEC.length, done = VIEC.filter(r=>vState(r.fields).done).length;
  const late = VIEC.filter(r=>vState(r.fields).late).length, now = VIEC.filter(r=>vState(r.fields).now).length;
  $('#vhead').innerHTML = total ? `<div><div class="meta">Dự án bắt đầu ${m}/${y}</div><div class="big">Đang ở tháng T${CFG.currentMonth}</div></div>
    <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div><div><b>${done}/${total}</b> <span class="meta">xong</span></div>
    <div><b>${now}</b> <span class="meta">trong hạn tháng này</span></div><div><b style="color:var(--bad)">${late}</b> <span class="meta">trễ</span></div>
    <a class="btn ghost" href="docs/00-tong-quan.md" target="_blank" rel="noopener" style="text-decoration:none;color:var(--ink)">Quy trình tổng quan</a>`
    : `<div><b>Chưa có công đoạn nào.</b> <span class="meta">Nạp 37 công đoạn của quy trình SEO 10 tháng.</span></div><span class="sp"></span><button class="btn primary" id="btnSeed">Nạp công đoạn</button>`;
  if(!total){ $('#btnSeed').onclick = async()=>{ try{ const r=await api('POST','/api/viec/seed'); toast(r.message); VIEC=await api('GET','/api/viec'); renderViec(); }catch(e){ toast(e.message,true);} }; $('#phases').innerHTML=''; return; }
  const fm=$('#fMang').value, fs=$('#fVs').value, fn=$('#fNow').checked;
  const list = VIEC.filter(r=>{ const f=r.fields, s=vState(f); return (!fm||f['Mảng']===fm) && (!fs||f['Trạng thái']===fs) && (!fn||s.now||s.late); })
    .sort((a,b)=>(a.fields['Từ tháng']-b.fields['Từ tháng'])||String(a.fields['Mã']).localeCompare(b.fields['Mã']));
  $('#phases').innerHTML = CFG.pha.map(ph=>{ const all=VIEC.filter(r=>r.fields['Pha']===ph), rows=list.filter(r=>r.fields['Pha']===ph); if(!rows.length) return '';
    const d = all.filter(r=>vState(r.fields).done).length;
    return `<section class="phase"><h3>${esc(ph)}<div class="bar"><i style="width:${Math.round(d/all.length*100)}%"></i></div><span class="meta">${d}/${all.length} xong</span></h3>${rows.map(vRow).join('')}</section>`;
  }).join('') || '<div class="empty">Không có việc nào khớp bộ lọc.</div>';

  document.querySelectorAll('.vs').forEach(el=>el.onchange=()=>saveViec(el.closest('.vrow').dataset.id, {'Trạng thái': el.value}));
  document.querySelectorAll('.vsave').forEach(el=>el.onclick=()=>{ const row=el.closest('.vrow');

      'Kết quả / link': row.querySelector('.vRes').value.trim(), 'Ghi chú': row.querySelector('.vNote').value}); });
  wireCommon($('#phases'));
}
function vRow(r){

      <div class="grid2" style="margin-top:6px"><label>Người phụ trách<input class="field vWho" value="${esc(f['Người phụ trách'])}"></label>
        <label>Hạn<input class="field vDue" type="date" value="${toDateInput(f['Hạn'])}"></label>
        <label class="full">Kết quả / link file<input class="field vRes" value="${esc(f['Kết quả / link'])}"></label>
        <label class="full">Ghi chú<textarea class="field vNote">${esc(f['Ghi chú'])}</textarea></label></div>
      <div class="acts"><button class="btn primary vsave">Lưu</button>${mg.sop?`<a class="btn" href="docs/${mg.sop}" target="_blank" rel="noopener">Mở SOP ${esc(f['Mảng'])}</a>`:''}
        <button class="btn" data-copy="${esc(cmd)}">Copy lệnh cho Claude</button></div></div></div>`;

/* ================= khởi động ================= */
$('#btnReload').onclick = async ()=>{ Object.keys(DATA).forEach(k=>delete DATA[k]); renderNav(); render(); };
$('#btnMigrate').onclick = async ()=>{ if(!confirm('Chép toàn bộ dữ liệu đang lưu trên máy lên Lark? Chỉ ghi vào bảng Lark còn trống, không ghi đè.')) return;
  $('#btnMigrate').disabled=true; try{ const r=await api('POST','/api/migrate'); toast(r.message);
    const poll=async()=>{ const s=await api('GET','/api/job/migrate'); if(s.running){ toast(s.lines.slice(-1)[0]||'Đang chuyển…'); setTimeout(poll,3000);} else { toast(s.result); $('#btnMigrate').disabled=false; Object.keys(DATA).forEach(k=>delete DATA[k]); renderNav(); render(); } }; setTimeout(poll,2000);
  }catch(e){ toast(e.message,true); $('#btnMigrate').disabled=false; } };
$('#btnSetup').onclick = async ()=>{ $('#btnSetup').disabled=true; try{ const r=await api('POST','/api/setup'); toast(r.message); }catch(e){ toast(e.message,true);} finally{ $('#btnSetup').disabled=false; } };
(async ()=>{
  try{
    CFG = await api('GET','/api/config');
    $('#mode').textContent = CFG.mode==='lark' ? '● Lark Base' : 'DEMO · lưu tạm trên máy';
    $('#mode').className = 'mode ' + CFG.mode;
    $('#btnSetup').hidden = CFG.mode!=='lark';
    $('#btnMigrate').hidden = CFG.mode!=='lark';
    $('#newForm').type.innerHTML = '<option value="">—</option>' + CFG.pageTypes.map(t=>`<option>${esc(t)}</option>`).join('');
    VIEW = store.get('rooty-view2','tongquan'); if(!GUIDES[VIEW]) VIEW='tongquan';
    renderNav(); render();
  }catch(e){ $('#main').innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
